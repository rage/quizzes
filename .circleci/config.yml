version: 2.1

commands:
  install_pnpm:
    steps:
      - run:
          name: "Install pnpm"
          command: |
            PNPM_SPEC=$(node -p 'require(process.argv[1]).packageManager' "$(git rev-parse --show-toplevel)/package.json")
            cd /tmp && sudo npm install -g --no-update-notifier "$PNPM_SPEC"

jobs:
  code_style:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - install_pnpm
      - run:
          name: "Install dependencies"
          command: pnpm install --frozen-lockfile
      - run:
          name: "Check code style"
          command: pnpm run format:check
      - run:
          name: "Lint"
          command: pnpm run lint:ci

  build_dashboardv2:
    docker:
      - image: google/cloud-sdk
    steps:
      - checkout
      - run:
          name: Install Docker CLI
          command: |
            apt-get update
            apt-get install -y docker.io
      - setup_remote_docker
      - run:
          name: "Build dashboard v2 image"
          command: "bin/build-docker-dashboardv2.sh"
      - run:
          name: "Push image if on master"
          command: "bin/push-docker-dashboardv2-image.sh"

  build_widgets:
    docker:
      - image: google/cloud-sdk
    steps:
      - checkout
      - run:
          name: Install Docker CLI
          command: |
            apt-get update
            apt-get install -y docker.io
      - setup_remote_docker
      - run:
          name: "Build widgets image"
          command: "bin/build-docker-widgets.sh"

  test_backend_v2:
    docker:
      - image: cimg/node:26.13.0
      - image: circleci/postgres:9.6-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizzes_test
      - image: circleci/redis:6.0.8-alpine

    steps:
      - checkout
      - install_pnpm
      - run:
          name: "Waiting for Postgres to be ready"
          command: |
            for i in `seq 1 10`;
            do
              nc -z localhost 5432 && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo Failed waiting for Postgres && exit 1
      - run:
          name: "Waiting for Redis to be ready"
          command: |
            for i in `seq 1 10`;
            do
              nc -z localhost 6379 && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo Failed waiting for Redis && exit 1
      - run:
          name: "install dependencies"
          command: pnpm install --frozen-lockfile --filter ./packages/backendv2
      - run:
          name: "run migrations"
          command: cd packages/backendv2 && export NODE_ENV=test && pnpm exec knex migrate:latest
      - run:
          name: install dockerize
          command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
          environment:
            DOCKERIZE_VERSION: v0.3.0
      - run:
          name: Wait for redis
          command: dockerize -wait tcp://localhost:6379 -timeout 1m
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: "run tests"
          command: "cd packages/backendv2 && pnpm run test --coverage"
          environment:
            REDIS_HOST: localhost
            REDIS_PORT: 6379
      - run:
          name: "Upload coverage"
          command: "cd packages/backendv2 && bash <(curl -s https://codecov.io/bash)"

  build_backendv2:
    docker:
      - image: google/cloud-sdk
    steps:
      - checkout
      - run:
          name: Install Docker CLI
          command: |
            apt-get update
            apt-get install -y docker.io
      - setup_remote_docker
      - run:
          name: "Build backend v2 image"
          command: "bin/build-docker-backendv2.sh"
      - run:
          name: "Push image if on master"
          command: "bin/push-docker-backendv2-image.sh"

  deploy_to_production:
    docker:
      - image: google/cloud-sdk
    steps:
      - checkout
      - run:
          name: Install Docker CLI
          command: |
            apt-get update
            apt-get install -y docker.io
      - setup_remote_docker
      - run:
          name: install envsubst
          command: apt-get install -qq -y gettext
      - run:
          name: "Deploy"
          command: "bin/ci-update-deployments.sh"

workflows:
  version: 2
  build-deploy:
    jobs:
      - build_dashboardv2
      - test_backend_v2
      - build_backendv2
      - build_widgets
      - code_style
      - deploy_to_production:
          requires:
            - build_dashboardv2
            - test_backend_v2
            - build_backendv2
            - build_widgets
            - code_style
          filters:
            branches:
              only:
                - master
