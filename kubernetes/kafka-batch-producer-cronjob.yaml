apiVersion: batch/v1
kind: CronJob
metadata:
  name: kafka-batch-producer
spec:
  schedule: "5/10 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kafka-batch-producer
              image: ${BACKENDV2_IMAGE}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: ["npm", "run", "kafka-batch-publish"]
              resources:
                requests:
                  memory: "300Mi"
              env:
                - name: NODE_ENV
                  value: production
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_DATABASE
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_HOST
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_PASSWORD
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_USERNAME
                - name: KAFKA_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: KAFKA_HOST
                - name: MESSAGE_FORMAT_VERSION
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: MESSAGE_FORMAT_VERSION
                - name: SERVICE_ID
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: SERVICE_ID
          initContainers:
            - name: quizzes-backendv2-run-migrations
              image: ${BACKENDV2_IMAGE}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: ['npx', 'knex', '--knexfile', 'dist/knexfile.js', 'migrate:latest']
              env:
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_DATABASE
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_HOST
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_PASSWORD
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_USERNAME
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: SENTRY_DSN
                - name: NODE_ENV
                  value: production
