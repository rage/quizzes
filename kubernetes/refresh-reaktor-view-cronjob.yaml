apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-reaktor-view
spec:
  schedule: "55 0 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh-reaktor-view
              image: ${BACKENDV2_IMAGE}
              command: ["npm", "run", "refresh-reaktor-view"]
              resources:
                requests:
                  memory: "100Mi"
              env:
                - name: NODE_ENV
                  value: production
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_DATABASE
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_HOST
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_PASSWORD
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_USERNAME
          initContainers:
            - name: quizzes-backendv2-run-migrations
              image: ${BACKENDV2_IMAGE}
              command: ['sh', '-c', 'npx knex migrate:latest']
              env:
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_DATABASE
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_HOST
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_PASSWORD
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: POSTGRES_USERNAME
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: backend-database-secret
                      key: SENTRY_DSN
                - name: NODE_ENV
                  value: production
